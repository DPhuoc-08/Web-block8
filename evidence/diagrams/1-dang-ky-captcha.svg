<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2015" width="1100" height="2015" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng ký có CAPTCHA và kích hoạt bằng mã</title>
<rect width="1100" height="2015" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng ký có CAPTCHA và kích hoạt bằng mã</text>
<text x="40" y="78" fill="#5f5f5a">POST /register → POST /activate · CAPTCHA xác minh TRƯỚC khi băm mật khẩu, tạo user hay gửi thư</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trình duyệt gửi form /register</text><text x="56" y="157" fill="#5f5f5a">email, password, passwordConfirm, _csrf</text><text x="56" y="176" fill="#5f5f5a">+ g-recaptcha-response (token Google cấp khi tick ô)</text><line x1="80" y1="193" x2="80" y2="227" stroke="#1f5b43" stroke-width="2"/><path d="M75 225 L80 233 L85 225Z" fill="#1f5b43"/><text x="90" y="217" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="233" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="233" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="259" font-weight="700" fill="#1d1d1b">CSRF: _csrf đúng của phiên, Origin là site này</text><text x="56" y="278" fill="#5f5f5a">Chạy trên method gốc, trước method-override</text><text x="56" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:25</text><rect x="650" y="233" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="259" font-weight="700" fill="#a8281d">403 Yêu cầu bị từ chối</text><text x="666" y="278" fill="#a8281d">Không đọc form, không ghi gì.</text><text x="666" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js</text><line x1="560" y1="259" x2="644" y2="259" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 254 L650 259 L642 264Z" fill="#a8281d"/><text x="605" y="252" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai / thiếu</text><line x1="80" y1="314" x2="80" y2="348" stroke="#1f5b43" stroke-width="2"/><path d="M75 346 L80 354 L85 346Z" fill="#1f5b43"/><text x="90" y="338" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="354" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="354" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="380" font-weight="700" fill="#1d1d1b">Giới hạn theo IP: 10 lần đăng ký / giờ</text><text x="56" y="399" fill="#5f5f5a">Một câu INSERT … ON CONFLICT tăng bộ đếm</text><text x="56" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:61 · DB rate_limits</text><rect x="650" y="354" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="380" font-weight="700" fill="#a8281d">429 + Retry-After</text><text x="666" y="399" fill="#a8281d">Trang “Thao tác quá nhiều lần”</text><text x="666" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/pages.js</text><line x1="560" y1="380" x2="644" y2="380" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 375 L650 380 L642 385Z" fill="#a8281d"/><text x="605" y="373" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><line x1="80" y1="435" x2="80" y2="469" stroke="#1f5b43" stroke-width="2"/><path d="M75 467 L80 475 L85 467Z" fill="#1f5b43"/><text x="90" y="459" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="475" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="475" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="501" font-weight="700" fill="#1d1d1b">reCAPTCHA: backend gọi Google siteverify</text><text x="56" y="520" fill="#5f5f5a">secret ở .env; qua khi success === true</text><text x="56" y="539" fill="#5f5f5a">VÀ hostname thuộc RECAPTCHA_HOSTNAMES</text><text x="56" y="558" fill="#5f5f5a">Không tin trường nào khác từ trình duyệt</text><text x="56" y="577" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:65 · auth/recaptcha.js</text><rect x="650" y="475" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="501" font-weight="700" fill="#a8281d">503 Chưa xác minh được</text><text x="666" y="520" fill="#a8281d">Không mặc định cho qua.</text><text x="666" y="539" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/pages.js captchaUnavailable</text><line x1="560" y1="501" x2="644" y2="501" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 496 L650 501 L642 506Z" fill="#a8281d"/><text x="605" y="494" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">lỗi mạng</text><rect x="650" y="566" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="592" font-weight="700" fill="#a8281d">200 CAPTCHA_REQUIRED / INVALID_CAPTCHA</text><text x="666" y="611" fill="#a8281d">Chưa băm mật khẩu, chưa ghi DB,</text><text x="666" y="630" fill="#a8281d">chưa gửi thư.</text><line x1="560" y1="592" x2="644" y2="592" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 587 L650 592 L642 597Z" fill="#a8281d"/><text x="605" y="585" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu / sai</text><line x1="80" y1="647" x2="80" y2="681" stroke="#1f5b43" stroke-width="2"/><path d="M75 679 L80 687 L85 679Z" fill="#1f5b43"/><text x="90" y="671" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="687" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="687" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="713" font-weight="700" fill="#1d1d1b">Kiểm dữ liệu</text><text x="56" y="732" fill="#5f5f5a">Email chuẩn hoá: trim + chữ thường (cùng một hàm</text><text x="56" y="751" fill="#5f5f5a">ở mọi form) · mật khẩu 8–64 ký tự, nhập lại khớp</text><text x="56" y="770" fill="#5f5f5a">Trường role (nếu có) bị bỏ qua → server gán viewer</text><text x="56" y="789" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:80</text><rect x="650" y="687" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="713" font-weight="700" fill="#a8281d">200 VALIDATION_FAILED</text><text x="666" y="732" fill="#a8281d">Đánh dấu ô sai; mật khẩu không điền lại.</text><line x1="560" y1="713" x2="644" y2="713" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 708 L650 713 L642 718Z" fill="#a8281d"/><text x="605" y="706" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="806" x2="80" y2="840" stroke="#1f5b43" stroke-width="2"/><path d="M75 838 L80 846 L85 838Z" fill="#1f5b43"/><text x="90" y="830" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="846" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="872" font-weight="700" fill="#1d1d1b">Băm mật khẩu Argon2id — LUÔN băm</text><text x="56" y="891" fill="#5f5f5a">Kể cả email đã có: thời gian phản hồi như nhau</text><text x="56" y="910" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:88</text><line x1="80" y1="927" x2="80" y2="961" stroke="#1f5b43" stroke-width="2"/><path d="M75 959 L80 967 L85 959Z" fill="#1f5b43"/><text x="90" y="951" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="967" width="520" height="176" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="967" width="5" height="176" rx="2" fill="#1f5b43"/><text x="56" y="993" font-weight="700" fill="#1d1d1b">Email đã có tài khoản?</text><text x="56" y="1012" fill="#5f5f5a">• Chưa có → MỘT transaction: users (pending, viewer)</text><text x="56" y="1031" fill="#5f5f5a">   + activation_challenges (HMAC-SHA256 của mã 6 số,</text><text x="56" y="1050" fill="#5f5f5a">   hạn 10 phút) → gửi thư sau khi trả lời</text><text x="56" y="1069" fill="#5f5f5a">• Pending → KHÔNG ghi đè mật khẩu; gửi lại mã nếu</text><text x="56" y="1088" fill="#5f5f5a">   còn hạn mức (chờ 60 giây, 5 lần / giờ)</text><text x="56" y="1107" fill="#5f5f5a">• Active → không ghi gì, không gửi thư</text><text x="56" y="1126" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:89 · DB users, activation_challenges</text><line x1="80" y1="1143" x2="80" y2="1177" stroke="#1f5b43" stroke-width="2"/><path d="M75 1175 L80 1183 L85 1175Z" fill="#1f5b43"/><text x="90" y="1167" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1183" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1209" font-weight="700" fill="#ffffff">303 /activate?msg=registered — CẢ BA nhánh giống hệt</text><text x="56" y="1228" fill="#ffffff">Cùng trang, cùng đếm ngược “Gửi lại mã” → không lộ email nào đã có</text><text x="56" y="1247" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/register.js:121</text><line x1="80" y1="1264" x2="80" y2="1298" stroke="#1f5b43" stroke-width="2"/><path d="M75 1296 L80 1304 L85 1296Z" fill="#1f5b43"/><text x="90" y="1288" font-size="12" fill="#1f5b43" font-weight="600">người dùng mở thư, nhập mã</text><rect x="40" y="1304" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="1330" font-weight="700" fill="#1d1d1b">POST /activate: email + mã 6 số + _csrf</text><text x="56" y="1349" fill="#5f5f5a">(qua CSRF và giới hạn theo IP như trên)</text><text x="56" y="1368" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:147</text><line x1="80" y1="1385" x2="80" y2="1419" stroke="#1f5b43" stroke-width="2"/><path d="M75 1417 L80 1425 L85 1417Z" fill="#1f5b43"/><text x="90" y="1409" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1425" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1425" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="1451" font-weight="700" fill="#1d1d1b">Đang khoá kích hoạt? (5 lần sai → khoá 15 phút)</text><text x="56" y="1470" fill="#5f5f5a">Email không có tài khoản cũng có bộ đếm riêng</text><text x="56" y="1489" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:163</text><rect x="650" y="1425" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1451" font-weight="700" fill="#a8281d">429 Tạm khoá kích hoạt</text><text x="666" y="1470" fill="#a8281d">Kể cả khi mã đúng.</text><line x1="560" y1="1451" x2="644" y2="1451" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1446 L650 1451 L642 1456Z" fill="#a8281d"/><text x="605" y="1444" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá</text><line x1="80" y1="1506" x2="80" y2="1540" stroke="#1f5b43" stroke-width="2"/><path d="M75 1538 L80 1546 L85 1538Z" fill="#1f5b43"/><text x="90" y="1530" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1546" width="520" height="119" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1546" width="5" height="119" rx="2" fill="#1f5b43"/><text x="56" y="1572" font-weight="700" fill="#1d1d1b">Mã đúng khi đủ 6 điều kiện</text><text x="56" y="1591" fill="#5f5f5a">pending · purpose = activation · chưa hết hạn ·</text><text x="56" y="1610" fill="#5f5f5a">chưa dùng · chưa vượt số lần thử · HMAC khớp</text><text x="56" y="1629" fill="#5f5f5a">(so bằng timingSafeEqual)</text><text x="56" y="1648" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:171</text><rect x="650" y="1546" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1572" font-weight="700" fill="#a8281d">200 INVALID_OTP — một câu chung</text><text x="666" y="1591" fill="#a8281d">attempts + 1; đủ 5 → lockedUntil = +15 phút</text><text x="666" y="1610" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">DB activation_challenges</text><line x1="560" y1="1572" x2="644" y2="1572" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1567 L650 1572 L642 1577Z" fill="#a8281d"/><text x="605" y="1565" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">bất kỳ lý do</text><line x1="80" y1="1665" x2="80" y2="1699" stroke="#1f5b43" stroke-width="2"/><path d="M75 1697 L80 1705 L85 1697Z" fill="#1f5b43"/><text x="90" y="1689" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1705" width="520" height="119" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1731" font-weight="700" fill="#1d1d1b">MỘT transaction: updateMany có điều kiện</text><text x="56" y="1750" fill="#5f5f5a">usedAt = now (chỉ khi vẫn chưa dùng) → count = 1 thì</text><text x="56" y="1769" fill="#5f5f5a">users.status = active, emailVerifiedAt = now</text><text x="56" y="1788" fill="#5f5f5a">Hai request cùng mã đúng: chỉ một request thắng</text><text x="56" y="1807" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/register.js:174</text><line x1="80" y1="1824" x2="80" y2="1858" stroke="#1f5b43" stroke-width="2"/><path d="M75 1856 L80 1864 L85 1856Z" fill="#1f5b43"/><text x="90" y="1848" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1864" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1890" font-weight="700" fill="#ffffff">303 /login?msg=activated — KHÔNG tự đăng nhập</text><text x="56" y="1909" fill="#ffffff">Người dùng đăng nhập ở bước riêng</text><text x="56" y="1928" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/register.js:201</text>
<text x="40" y="1987" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn block8 ngày 03/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL (Supabase block7) · nhóm duyệt trước khi dùng.</text>
</svg>