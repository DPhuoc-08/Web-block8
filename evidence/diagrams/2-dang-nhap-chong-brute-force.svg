<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1545" width="1100" height="1545" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng nhập chống brute force</title>
<rect width="1100" height="1545" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng nhập chống brute force</text>
<text x="40" y="78" fill="#5f5f5a">POST /login · thứ tự cố định: giới hạn IP → khoá theo email → CAPTCHA (khi cần) → mật khẩu → trạng thái → phiên</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="81" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trình duyệt gửi form /login</text><text x="56" y="157" fill="#5f5f5a">email, password, next (nếu bị chuyển từ /admin), _csrf</text><text x="56" y="176" fill="#5f5f5a">+ g-recaptcha-response khi form có CAPTCHA</text><line x1="80" y1="193" x2="80" y2="227" stroke="#1f5b43" stroke-width="2"/><path d="M75 225 L80 233 L85 225Z" fill="#1f5b43"/><text x="90" y="217" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="233" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="233" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="259" font-weight="700" fill="#1d1d1b">CSRF: _csrf đúng của phiên, Origin là site này</text><text x="56" y="278" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:25</text><rect x="650" y="233" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="259" font-weight="700" fill="#a8281d">403 Yêu cầu bị từ chối</text><text x="666" y="278" fill="#a8281d">Không đọc form, không ghi gì.</text><text x="666" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js</text><line x1="560" y1="259" x2="644" y2="259" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 254 L650 259 L642 264Z" fill="#a8281d"/><text x="605" y="252" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai / thiếu</text><line x1="80" y1="314" x2="80" y2="348" stroke="#1f5b43" stroke-width="2"/><path d="M75 346 L80 354 L85 346Z" fill="#1f5b43"/><text x="90" y="338" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="354" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="354" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="380" font-weight="700" fill="#1d1d1b">① Giới hạn theo IP: 30 lần gửi / 15 phút</text><text x="56" y="399" fill="#5f5f5a">Đếm MỌI lần gửi, kể cả lần CAPTCHA sai</text><text x="56" y="418" fill="#5f5f5a">Chỉ tin req.ip (không trust proxy, không X-Forwarded-For)</text><text x="56" y="437" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:71 · DB rate_limits</text><rect x="650" y="354" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="380" font-weight="700" fill="#a8281d">429 Tạm khoá đăng nhập + Retry-After</text><line x1="560" y1="380" x2="644" y2="380" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 375 L650 380 L642 385Z" fill="#a8281d"/><text x="605" y="373" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><line x1="80" y1="454" x2="80" y2="488" stroke="#1f5b43" stroke-width="2"/><path d="M75 486 L80 494 L85 486Z" fill="#1f5b43"/><text x="90" y="478" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="494" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="494" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="520" font-weight="700" fill="#1d1d1b">Có email và mật khẩu?</text><text x="56" y="539" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:74</text><rect x="650" y="494" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="520" font-weight="700" fill="#a8281d">200 VALIDATION_FAILED</text><line x1="560" y1="520" x2="644" y2="520" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 515 L650 520 L642 525Z" fill="#a8281d"/><text x="605" y="513" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu</text><line x1="80" y1="556" x2="80" y2="590" stroke="#1f5b43" stroke-width="2"/><path d="M75 588 L80 596 L85 588Z" fill="#1f5b43"/><text x="90" y="580" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="596" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="596" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="622" font-weight="700" fill="#1d1d1b">② Email đang bị khoá? (đủ 10 lần sai / 15 phút)</text><text x="56" y="641" fill="#5f5f5a">Đọc bộ đếm login-fail:email:&lt;email đã chuẩn hoá&gt;</text><text x="56" y="660" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:82 · DB rate_limits</text><rect x="650" y="596" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="622" font-weight="700" fill="#a8281d">429 + Retry-After</text><text x="666" y="641" fill="#a8281d">DÙ CAPTCHA và mật khẩu đúng.</text><text x="666" y="660" fill="#a8281d">Không so mật khẩu.</text><line x1="560" y1="622" x2="644" y2="622" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 617 L650 622 L642 627Z" fill="#a8281d"/><text x="605" y="615" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">đang khoá</text><line x1="80" y1="677" x2="80" y2="711" stroke="#1f5b43" stroke-width="2"/><path d="M75 709 L80 717 L85 709Z" fill="#1f5b43"/><text x="90" y="701" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="717" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="717" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="743" font-weight="700" fill="#1d1d1b">③ Đã sai ≥ 3 lần? → bắt buộc CAPTCHA</text><text x="56" y="762" fill="#5f5f5a">siteverify: success + hostname · token dùng một lần</text><text x="56" y="781" fill="#5f5f5a">Giải đúng CAPTCHA KHÔNG xoá bộ đếm</text><text x="56" y="800" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:86</text><rect x="650" y="717" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="743" font-weight="700" fill="#a8281d">503 Chưa xác minh được</text><line x1="560" y1="743" x2="644" y2="743" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 738 L650 743 L642 748Z" fill="#a8281d"/><text x="605" y="736" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">lỗi mạng</text><rect x="650" y="770" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="796" font-weight="700" fill="#a8281d">200 CAPTCHA_REQUIRED / INVALID_CAPTCHA</text><text x="666" y="815" fill="#a8281d">Chưa so mật khẩu; bộ đếm email không đổi.</text><line x1="560" y1="796" x2="644" y2="796" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 791 L650 796 L642 801Z" fill="#a8281d"/><text x="605" y="789" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">thiếu / sai</text><line x1="80" y1="832" x2="80" y2="866" stroke="#1f5b43" stroke-width="2"/><path d="M75 864 L80 872 L85 864Z" fill="#1f5b43"/><text x="90" y="856" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="872" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="872" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="898" font-weight="700" fill="#1d1d1b">④ So mật khẩu (argon2.verify)</text><text x="56" y="917" fill="#5f5f5a">Email không có tài khoản → verify với hash giả</text><text x="56" y="936" fill="#5f5f5a">→ cùng thời gian, cùng một câu thông báo</text><text x="56" y="955" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:99</text><rect x="650" y="872" width="410" height="138" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="898" font-weight="700" fill="#a8281d">Bộ đếm theo email + 1 (một câu SQL)</text><text x="666" y="917" fill="#a8281d">Đủ 10 → khoá 5 phút → 429</text><text x="666" y="936" fill="#a8281d">Còn lại → 200 INVALID_CREDENTIALS:</text><text x="666" y="955" fill="#a8281d">“Email hoặc mật khẩu không đúng.”</text><text x="666" y="974" fill="#a8281d">Form giữ email, bỏ mật khẩu; từ lần 3 có CAPTCHA</text><text x="666" y="993" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:102 · DB rate_limits</text><line x1="560" y1="898" x2="644" y2="898" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 893 L650 898 L642 903Z" fill="#a8281d"/><text x="605" y="891" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai</text><line x1="80" y1="1010" x2="80" y2="1044" stroke="#1f5b43" stroke-width="2"/><path d="M75 1042 L80 1050 L85 1042Z" fill="#1f5b43"/><text x="90" y="1034" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1050" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1050" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="1076" font-weight="700" fill="#1d1d1b">⑤ Tài khoản active?</text><text x="56" y="1095" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:113</text><rect x="650" y="1050" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1076" font-weight="700" fill="#a8281d">200 ACCOUNT_NOT_ACTIVATED</text><text x="666" y="1095" fill="#a8281d">KHÔNG tạo phiên; link tới trang nhập mã.</text><line x1="560" y1="1076" x2="644" y2="1076" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1071 L650 1076 L642 1081Z" fill="#a8281d"/><text x="605" y="1069" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">pending</text><line x1="80" y1="1112" x2="80" y2="1146" stroke="#1f5b43" stroke-width="2"/><path d="M75 1144 L80 1152 L85 1144Z" fill="#1f5b43"/><text x="90" y="1136" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1152" width="520" height="62" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1178" font-weight="700" fill="#1d1d1b">Xoá bộ đếm theo email (KHÔNG xoá giới hạn IP)</text><text x="56" y="1197" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:121</text><line x1="80" y1="1214" x2="80" y2="1248" stroke="#1f5b43" stroke-width="2"/><path d="M75 1246 L80 1254 L85 1246Z" fill="#1f5b43"/><text x="90" y="1238" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1254" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1280" font-weight="700" fill="#1d1d1b">regenerate: huỷ phiên cũ, cấp sid MỚI</text><text x="56" y="1299" fill="#5f5f5a">Gắn userId + loginAt; ghi bản ghi sessions xong mới trả lời</text><text x="56" y="1318" fill="#5f5f5a">(chống session fixation)</text><text x="56" y="1337" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:122 · DB sessions</text><line x1="80" y1="1354" x2="80" y2="1388" stroke="#1f5b43" stroke-width="2"/><path d="M75 1386 L80 1394 L85 1386Z" fill="#1f5b43"/><text x="90" y="1378" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1394" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1420" font-weight="700" fill="#ffffff">303 next (đường dẫn nội bộ) hoặc /admin/dishes</text><text x="56" y="1439" fill="#ffffff">Set-Cookie: sid=… HttpOnly; SameSite=Lax; Path=/</text><text x="56" y="1458" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/login.js:126</text>
<text x="40" y="1517" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn block8 ngày 03/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL (Supabase block7) · nhóm duyệt trước khi dùng.</text>
</svg>