<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1303" width="1100" height="1303" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng xuất và request sau đó</title>
<rect width="1100" height="1303" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng xuất và request sau đó</text>
<text x="40" y="78" fill="#5f5f5a">POST /logout (nút trên header, form có _csrf) · không có GET /logout</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trình duyệt gửi form POST /logout</text><text x="56" y="157" fill="#5f5f5a">Cookie: sid=… · _csrf</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Còn phiên đăng nhập?</text><text x="56" y="259" fill="#5f5f5a">Không còn (đã đăng xuất ở tab khác, phiên hết hạn): 303 /login?msg=logged-out,</text><text x="56" y="278" fill="#5f5f5a">không có gì để huỷ nên không cần _csrf</text><text x="56" y="297" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">app.js:74</text><line x1="80" y1="314" x2="80" y2="348" stroke="#1f5b43" stroke-width="2"/><path d="M75 346 L80 354 L85 346Z" fill="#1f5b43"/><text x="90" y="338" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="354" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="354" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="380" font-weight="700" fill="#1d1d1b">CSRF: _csrf đúng của phiên, Origin là site này</text><text x="56" y="399" fill="#5f5f5a">Trang khác không đăng xuất hộ được</text><text x="56" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:25</text><rect x="650" y="354" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="380" font-weight="700" fill="#a8281d">403 Yêu cầu bị từ chối</text><text x="666" y="399" fill="#a8281d">Không đọc form, không ghi gì.</text><text x="666" y="418" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js</text><line x1="560" y1="380" x2="644" y2="380" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 375 L650 380 L642 385Z" fill="#a8281d"/><text x="605" y="373" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai / thiếu</text><rect x="650" y="445" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="471" font-weight="700" fill="#a8281d">404 — không route nào đổi trạng thái bằng GET</text><line x1="560" y1="471" x2="644" y2="471" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 466 L650 471 L642 476Z" fill="#a8281d"/><text x="605" y="464" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">GET /logout</text><line x1="80" y1="488" x2="80" y2="522" stroke="#1f5b43" stroke-width="2"/><path d="M75 520 L80 528 L85 520Z" fill="#1f5b43"/><text x="90" y="512" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="528" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="554" font-weight="700" fill="#1d1d1b">① Huỷ bản ghi phiên ở server TRƯỚC</text><text x="56" y="573" fill="#5f5f5a">req.session.destroy → DELETE khỏi bảng sessions</text><text x="56" y="592" fill="#5f5f5a">Mọi bản sao của cookie sid cũ thành vô dụng</text><text x="56" y="611" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:132 · DB sessions</text><line x1="80" y1="628" x2="80" y2="662" stroke="#1f5b43" stroke-width="2"/><path d="M75 660 L80 668 L85 660Z" fill="#1f5b43"/><text x="90" y="652" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="668" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="694" font-weight="700" fill="#1d1d1b">② Rồi mới xoá cookie ở trình duyệt</text><text x="56" y="713" fill="#5f5f5a">Set-Cookie: sid=; Expires=1970 (cùng Path, HttpOnly, SameSite)</text><text x="56" y="732" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:134</text><line x1="80" y1="749" x2="80" y2="783" stroke="#1f5b43" stroke-width="2"/><path d="M75 781 L80 789 L85 781Z" fill="#1f5b43"/><text x="90" y="773" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="789" width="520" height="62" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="815" font-weight="700" fill="#ffffff">303 /login?msg=logged-out</text><text x="56" y="834" fill="#ffffff">“Bạn đã đăng xuất.”</text><line x1="80" y1="851" x2="80" y2="885" stroke="#1f5b43" stroke-width="2"/><path d="M75 883 L80 891 L85 883Z" fill="#1f5b43"/><text x="90" y="875" font-size="12" fill="#1f5b43" font-weight="600">ai đó gửi lại sid cũ</text><rect x="40" y="891" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="917" font-weight="700" fill="#1d1d1b">GET /admin/dishes với Cookie: sid=&lt;sid cũ&gt;</text><text x="56" y="936" fill="#5f5f5a">(chép từ trước, hoặc bấm Back rồi thao tác)</text><line x1="80" y1="953" x2="80" y2="987" stroke="#1f5b43" stroke-width="2"/><path d="M75 985 L80 993 L85 985Z" fill="#1f5b43"/><text x="90" y="977" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="993" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="993" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="1019" font-weight="700" fill="#1d1d1b">loadUser: tra sid trong bảng sessions</text><text x="56" y="1038" fill="#5f5f5a">Không có bản ghi / hết hạn 2 giờ không dùng / quá 12 giờ</text><text x="56" y="1057" fill="#5f5f5a">/ tài khoản không còn active → không có currentUser</text><text x="56" y="1076" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js:11</text><line x1="80" y1="1093" x2="80" y2="1127" stroke="#1f5b43" stroke-width="2"/><path d="M75 1125 L80 1133 L85 1125Z" fill="#1f5b43"/><text x="90" y="1117" font-size="12" fill="#1f5b43" font-weight="600">currentUser rỗng</text><rect x="40" y="1133" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1133" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="1159" font-weight="700" fill="#1d1d1b">requireLogin cho mọi /admin (trước csrf)</text><text x="56" y="1178" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">app.js:71</text><rect x="650" y="1133" width="410" height="100" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1159" font-weight="700" fill="#a8281d">303 /login?next=/admin/dishes</text><text x="666" y="1178" fill="#a8281d">POST / PATCH / DELETE → 303 /login.</text><text x="666" y="1197" fill="#a8281d">Dữ liệu không đổi.</text><text x="666" y="1216" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-login.js</text><line x1="560" y1="1159" x2="644" y2="1159" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1154 L650 1159 L642 1164Z" fill="#a8281d"/><text x="605" y="1152" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không có</text>
<text x="40" y="1275" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn block8 ngày 03/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL (Supabase block7) · nhóm duyệt trước khi dùng.</text>
</svg>