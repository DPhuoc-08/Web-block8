<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1163" width="1100" height="1163" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Đăng xuất và request sau đó</title>
<rect width="1100" height="1163" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Đăng xuất và request sau đó</text>
<text x="40" y="78" fill="#5f5f5a">POST /logout (nút trên header, form có _csrf) · không có GET /logout</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">Trình duyệt gửi form POST /logout</text><text x="56" y="157" fill="#5f5f5a">Cookie: sid=… · _csrf</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">CSRF: _csrf đúng của phiên, Origin là site này</text><text x="56" y="259" fill="#5f5f5a">Trang khác không đăng xuất hộ được</text><text x="56" y="278" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:25</text><rect x="650" y="214" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="240" font-weight="700" fill="#a8281d">403 Yêu cầu bị từ chối</text><text x="666" y="259" fill="#a8281d">Không đọc form, không ghi gì.</text><text x="666" y="278" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js</text><line x1="560" y1="240" x2="644" y2="240" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 235 L650 240 L642 245Z" fill="#a8281d"/><text x="605" y="233" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai / thiếu</text><rect x="650" y="305" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="331" font-weight="700" fill="#a8281d">404 — không route nào đổi trạng thái bằng GET</text><line x1="560" y1="331" x2="644" y2="331" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 326 L650 331 L642 336Z" fill="#a8281d"/><text x="605" y="324" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">GET /logout</text><line x1="80" y1="348" x2="80" y2="382" stroke="#1f5b43" stroke-width="2"/><path d="M75 380 L80 388 L85 380Z" fill="#1f5b43"/><text x="90" y="372" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="388" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="414" font-weight="700" fill="#1d1d1b">① Huỷ bản ghi phiên ở server TRƯỚC</text><text x="56" y="433" fill="#5f5f5a">req.session.destroy → DELETE khỏi bảng sessions</text><text x="56" y="452" fill="#5f5f5a">Mọi bản sao của cookie sid cũ thành vô dụng</text><text x="56" y="471" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:132 · DB sessions</text><line x1="80" y1="488" x2="80" y2="522" stroke="#1f5b43" stroke-width="2"/><path d="M75 520 L80 528 L85 520Z" fill="#1f5b43"/><text x="90" y="512" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="528" width="520" height="81" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="554" font-weight="700" fill="#1d1d1b">② Rồi mới xoá cookie ở trình duyệt</text><text x="56" y="573" fill="#5f5f5a">Set-Cookie: sid=; Expires=1970 (cùng Path, HttpOnly, SameSite)</text><text x="56" y="592" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/login.js:134</text><line x1="80" y1="609" x2="80" y2="643" stroke="#1f5b43" stroke-width="2"/><path d="M75 641 L80 649 L85 641Z" fill="#1f5b43"/><text x="90" y="633" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="649" width="520" height="62" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="675" font-weight="700" fill="#ffffff">303 /login?msg=logged-out</text><text x="56" y="694" fill="#ffffff">“Bạn đã đăng xuất.”</text><line x1="80" y1="711" x2="80" y2="745" stroke="#1f5b43" stroke-width="2"/><path d="M75 743 L80 751 L85 743Z" fill="#1f5b43"/><text x="90" y="735" font-size="12" fill="#1f5b43" font-weight="600">ai đó gửi lại sid cũ</text><rect x="40" y="751" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="777" font-weight="700" fill="#1d1d1b">GET /admin/dishes với Cookie: sid=&lt;sid cũ&gt;</text><text x="56" y="796" fill="#5f5f5a">(chép từ trước, hoặc bấm Back rồi thao tác)</text><line x1="80" y1="813" x2="80" y2="847" stroke="#1f5b43" stroke-width="2"/><path d="M75 845 L80 853 L85 845Z" fill="#1f5b43"/><text x="90" y="837" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="853" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="853" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="879" font-weight="700" fill="#1d1d1b">loadUser: tra sid trong bảng sessions</text><text x="56" y="898" fill="#5f5f5a">Không có bản ghi / hết hạn 2 giờ không dùng / quá 12 giờ</text><text x="56" y="917" fill="#5f5f5a">/ tài khoản không còn active → không có currentUser</text><text x="56" y="936" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/load-user.js:11</text><line x1="80" y1="953" x2="80" y2="987" stroke="#1f5b43" stroke-width="2"/><path d="M75 985 L80 993 L85 985Z" fill="#1f5b43"/><text x="90" y="977" font-size="12" fill="#1f5b43" font-weight="600">currentUser rỗng</text><rect x="40" y="993" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="993" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="1019" font-weight="700" fill="#1d1d1b">requireLogin cho mọi /admin (trước csrf)</text><text x="56" y="1038" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">app.js:69</text><rect x="650" y="993" width="410" height="100" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1019" font-weight="700" fill="#a8281d">303 /login?next=/admin/dishes</text><text x="666" y="1038" fill="#a8281d">POST / PATCH / DELETE → 303 /login.</text><text x="666" y="1057" fill="#a8281d">Dữ liệu không đổi.</text><text x="666" y="1076" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/require-login.js</text><line x1="560" y1="1019" x2="644" y2="1019" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1014 L650 1019 L642 1024Z" fill="#a8281d"/><text x="605" y="1012" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không có</text>
<text x="40" y="1135" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn block8 ngày 03/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL (Supabase block7) · nhóm duyệt trước khi dùng.</text>
</svg>