<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1583" width="1100" height="1583" font-family="'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
<title>Quên mật khẩu và đặt lại</title>
<rect width="1100" height="1583" fill="#f7f6f3"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#1d1d1b">Quên mật khẩu và đặt lại</text>
<text x="40" y="78" fill="#5f5f5a">POST /forgot → thư → GET /reset (chỉ hiện form) → POST /reset (tiêu thụ token)</text>
<text x="80" y="104" font-size="12" font-weight="700" fill="#1f5b43" letter-spacing=".04em">LUỒNG CHÍNH (thứ tự trong code)</text>
<text x="650" y="104" font-size="12" font-weight="700" fill="#a8281d" letter-spacing=".04em">DỪNG Ở ĐÂY — không làm các bước bên dưới</text>
<rect x="40" y="112" width="520" height="62" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="138" font-weight="700" fill="#1d1d1b">POST /forgot: email + _csrf</text><text x="56" y="157" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">(qua CSRF như các form khác)</text><line x1="80" y1="174" x2="80" y2="208" stroke="#1f5b43" stroke-width="2"/><path d="M75 206 L80 214 L85 206Z" fill="#1f5b43"/><text x="90" y="198" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="214" width="520" height="81" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="214" width="5" height="81" rx="2" fill="#1f5b43"/><text x="56" y="240" font-weight="700" fill="#1d1d1b">Giới hạn IP 10 / giờ · định dạng email · email 3 / giờ</text><text x="56" y="259" fill="#5f5f5a">Bộ đếm theo email tính cả email KHÔNG có tài khoản</text><text x="56" y="278" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:45 · DB rate_limits</text><rect x="650" y="214" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="240" font-weight="700" fill="#a8281d">429 + Retry-After</text><line x1="560" y1="240" x2="644" y2="240" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 235 L650 240 L642 245Z" fill="#a8281d"/><text x="605" y="233" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><rect x="650" y="267" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="293" font-weight="700" fill="#a8281d">200 VALIDATION_FAILED</text><line x1="560" y1="293" x2="644" y2="293" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 288 L650 293 L642 298Z" fill="#a8281d"/><text x="605" y="286" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">sai định dạng</text><line x1="80" y1="310" x2="80" y2="344" stroke="#1f5b43" stroke-width="2"/><path d="M75 342 L80 350 L85 342Z" fill="#1f5b43"/><text x="90" y="334" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="350" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="376" font-weight="700" fill="#ffffff">303 /forgot?msg=forgot-sent — trả lời NGAY</text><text x="56" y="395" fill="#ffffff">Email có hay không: cùng trang, cùng status, cùng thời gian</text><text x="56" y="414" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/password-reset.js:59</text><line x1="80" y1="431" x2="80" y2="465" stroke="#1f5b43" stroke-width="2"/><path d="M75 463 L80 471 L85 463Z" fill="#1f5b43"/><text x="90" y="455" font-size="12" fill="#1f5b43" font-weight="600">sau khi đã trả lời (setImmediate)</text><rect x="40" y="471" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="471" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="497" font-weight="700" fill="#1d1d1b">Email có tài khoản?</text><text x="56" y="516" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:62</text><rect x="650" y="471" width="410" height="43" rx="10" fill="#fdf3dc" stroke="#ecd9a8"/><text x="666" y="497" font-weight="700" fill="#8a5a00">Dừng — không ghi gì, không gửi thư</text><line x1="560" y1="497" x2="644" y2="497" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 492 L650 497 L642 502Z" fill="#a8281d"/><text x="605" y="490" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">không</text><line x1="80" y1="533" x2="80" y2="567" stroke="#1f5b43" stroke-width="2"/><path d="M75 565 L80 573 L85 565Z" fill="#1f5b43"/><text x="90" y="557" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="573" width="520" height="100" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="599" font-weight="700" fill="#1d1d1b">MỘT transaction: vô hiệu token cũ + tạo token mới</text><text x="56" y="618" fill="#5f5f5a">Token 32 byte ngẫu nhiên (crypto) — DB chỉ lưu SHA-256,</text><text x="56" y="637" fill="#5f5f5a">hạn 15 phút · thư: APP_ORIGIN/reset?token=… (không dùng Host)</text><text x="56" y="656" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:70 · DB password_resets</text><line x1="80" y1="673" x2="80" y2="707" stroke="#1f5b43" stroke-width="2"/><path d="M75 705 L80 713 L85 705Z" fill="#1f5b43"/><text x="90" y="697" font-size="12" fill="#1f5b43" font-weight="600">người dùng bấm link trong thư</text><rect x="40" y="713" width="520" height="100" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="713" width="5" height="100" rx="2" fill="#1f5b43"/><text x="56" y="739" font-weight="700" fill="#1d1d1b">GET /reset?token=…: Referrer-Policy: no-referrer</text><text x="56" y="758" fill="#5f5f5a">Giới hạn IP 20 / 15 phút · token còn hạn, chưa dùng?</text><text x="56" y="777" fill="#5f5f5a">CHỈ hiện form — không ghi usedAt</text><text x="56" y="796" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:104</text><rect x="650" y="713" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="739" font-weight="700" fill="#a8281d">429 + Retry-After</text><line x1="560" y1="739" x2="644" y2="739" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 734 L650 739 L642 744Z" fill="#a8281d"/><text x="605" y="732" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><rect x="650" y="766" width="410" height="81" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="792" font-weight="700" fill="#a8281d">200 “Link không dùng được”</text><text x="666" y="811" fill="#a8281d">Sai / hết hạn / đã dùng: một câu chung,</text><text x="666" y="830" fill="#a8281d">không cho biết lý do.</text><line x1="560" y1="792" x2="644" y2="792" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 787 L650 792 L642 797Z" fill="#a8281d"/><text x="605" y="785" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">token hỏng</text><line x1="80" y1="847" x2="80" y2="881" stroke="#1f5b43" stroke-width="2"/><path d="M75 879 L80 887 L85 879Z" fill="#1f5b43"/><text x="90" y="871" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="887" width="520" height="100" rx="10" fill="#eef0f3" stroke="#d9d6cf"/><text x="56" y="913" font-weight="700" fill="#1d1d1b">POST /reset: token (ô ẩn) + mật khẩu mới ×2 + _csrf</text><text x="56" y="932" fill="#5f5f5a">Chrome gửi Origin: null (trang no-referrer) → csrf.js chỉ</text><text x="56" y="951" fill="#5f5f5a">chấp nhận null ở route này, vẫn bắt buộc _csrf + token</text><text x="56" y="970" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">auth/csrf.js:37</text><line x1="80" y1="987" x2="80" y2="1021" stroke="#1f5b43" stroke-width="2"/><path d="M75 1019 L80 1027 L85 1019Z" fill="#1f5b43"/><text x="90" y="1011" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1027" width="520" height="62" rx="10" fill="#ffffff" stroke="#d9d6cf"/><rect x="40" y="1027" width="5" height="62" rx="2" fill="#1f5b43"/><text x="56" y="1053" font-weight="700" fill="#1d1d1b">Giới hạn IP · token còn hợp lệ? · mật khẩu mới 8–64, khớp?</text><text x="56" y="1072" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:112</text><rect x="650" y="1027" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1053" font-weight="700" fill="#a8281d">429 + Retry-After</text><line x1="560" y1="1053" x2="644" y2="1053" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1048 L650 1053 L642 1058Z" fill="#a8281d"/><text x="605" y="1046" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">vượt</text><rect x="650" y="1080" width="410" height="43" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1106" font-weight="700" fill="#a8281d">200 “Link không dùng được”</text><line x1="560" y1="1106" x2="644" y2="1106" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1101 L650 1106 L642 1111Z" fill="#a8281d"/><text x="605" y="1099" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">token hỏng</text><rect x="650" y="1133" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1159" font-weight="700" fill="#a8281d">200 VALIDATION_FAILED</text><text x="666" y="1178" fill="#a8281d">Token chưa bị dùng.</text><line x1="560" y1="1159" x2="644" y2="1159" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1154 L650 1159 L642 1164Z" fill="#a8281d"/><text x="605" y="1152" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">mật khẩu sai</text><line x1="80" y1="1195" x2="80" y2="1229" stroke="#1f5b43" stroke-width="2"/><path d="M75 1227 L80 1235 L85 1227Z" fill="#1f5b43"/><text x="90" y="1219" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1235" width="520" height="157" rx="10" fill="#e8f1ec" stroke="#b9d3c5"/><text x="56" y="1261" font-weight="700" fill="#1d1d1b">Argon2id mật khẩu mới → MỘT transaction</text><text x="56" y="1280" fill="#5f5f5a">① updateMany token: usedAt rỗng, chưa hết hạn → count = 1?</text><text x="56" y="1299" fill="#5f5f5a">② users.passwordHash mới (status KHÔNG đổi)</text><text x="56" y="1318" fill="#5f5f5a">③ vô hiệu mọi token khác  ④ xoá MỌI phiên của user</text><text x="56" y="1337" fill="#5f5f5a">Hai request cùng token: chỉ một request đổi được</text><text x="56" y="1356" fill="#5f5f5a">DB: password_resets, users, sessions</text><text x="56" y="1375" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8a8780">routes/auth/password-reset.js:130</text><rect x="650" y="1235" width="410" height="62" rx="10" fill="#fbecea" stroke="#efc2bd"/><text x="666" y="1261" font-weight="700" fill="#a8281d">200 “Link không dùng được”</text><text x="666" y="1280" fill="#a8281d">Không đổi gì.</text><line x1="560" y1="1261" x2="644" y2="1261" stroke="#a8281d" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M642 1256 L650 1261 L642 1266Z" fill="#a8281d"/><text x="605" y="1254" font-size="12" text-anchor="middle" fill="#a8281d" font-weight="600">count ≠ 1</text><line x1="80" y1="1392" x2="80" y2="1426" stroke="#1f5b43" stroke-width="2"/><path d="M75 1424 L80 1432 L85 1424Z" fill="#1f5b43"/><text x="90" y="1416" font-size="12" fill="#1f5b43" font-weight="600">qua</text><rect x="40" y="1432" width="520" height="81" rx="10" fill="#1f5b43" stroke="#1f5b43"/><text x="56" y="1458" font-weight="700" fill="#ffffff">Thư “Mật khẩu đã được đổi” · 303 /login?msg=password-reset</text><text x="56" y="1477" fill="#ffffff">KHÔNG tự đăng nhập — đăng nhập lại theo luồng thường</text><text x="56" y="1496" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d6e7de">routes/auth/password-reset.js:141</text>
<text x="40" y="1555" font-size="12" fill="#5f5f5a">Vẽ nháp từ mã nguồn block8 ngày 03/11/2026 · file:dòng trỏ vào source-code/src/ · DB = bảng trong PostgreSQL (Supabase block7) · nhóm duyệt trước khi dùng.</text>
</svg>